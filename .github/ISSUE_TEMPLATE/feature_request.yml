name: Feature request
description: Suggest a safe improvement to the desktop workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: version
    attributes:
      label: App version
      description: Choose the version this idea relates to, if any.
      options:
        - 1.9.0 (beta 1)
        - 1.8.0 (beta 1)
        - Development/source build
        - Not version-specific / not sure
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Not OS-specific / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the user would click and what the app would do.
    validations:
      required: true
