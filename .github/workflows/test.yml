name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install source and checks
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r packaging/requirements-build.txt -e .
      - name: Validate Python and QML shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src tests scripts
          mypy src
          pytest -q
          pyside6-qmllint --missing-property error --unqualified disable src/quest_renamer/qml/*.qml
          quest-renamer --smoke-test
